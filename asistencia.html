<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUMBO GAC - Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="core/ui-kit.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Estilos específicos de asistencia */
        .asis-dashboard {
            display: grid;
            grid-template-columns: 3fr 1.15fr;
            gap: 22px;
            align-items: stretch;
        }

        .asis-left { display: flex; flex-direction: column; gap: 20px; }
        .asis-right { display: flex; }

        .asis-clock-card {
            min-height: 235px;
            justify-content: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 18px;
            text-align: center;
            padding: 32px 18px;
            position: relative;
            overflow: hidden;
        }

        .asis-conectado-pill {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            color: #0f8f5f;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            padding: 4px 12px;
        }

        .asis-conectado-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10B981;
            animation: asisPulse 1.4s ease-in-out infinite;
        }

        @keyframes asisPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        .asis-date-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .asis-time {
            font-size: 88px;
            font-weight: 700;
            color: #003E9C;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 64, 161, 0.12);
        }

        .asis-tz-pill {
            margin-top: 18px;
            font-size: 11px;
            background: #e8eaf6;
            color: var(--color-primary);
            border-radius: 20px;
            padding: 2px 10px;
            display: inline-block;
        }

        .mark-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(230px, 1fr));
            gap: 20px;
        }

        .mark-btn {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 12px;
            min-height: 165px;
            padding: 22px;
            border-radius: 16px;
            transition: .25s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
            border: none;
            cursor: pointer;
            text-align: left;
            position: relative;
        }

        .mark-btn:hover:not(.done):not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, .10);
        }

        .mark-btn.done, .mark-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .mb-entrada { background: #EEF8F1; }
        .mb-almuerzo { background: #FFF6E8; }
        .mb-regreso { background: #EEF5FF; }
        .mb-salida { background: #FFF1F1; }

        .mark-icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mark-icon-circle .material-symbols-outlined {
            color: white;
            font-size: 24px;
        }

        .green { background: #31A24C; }
        .orange { background: #F39C12; }
        .blue { background: #1F7AE0; }
        .red { background: #E74C3C; }

        .mark-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 8px;
        }

        .mark-sub {
            margin-top: 3px;
            font-size: 14px;
            color: #666;
        }

        .mark-time {
            margin-top: auto;
            font-size: 18px;
            font-weight: 700;
            background: none;
            padding: 0;
        }

        .mark-time.green { color: #2e7d32; }
        .mark-time.yellow { color: #FB923C; }
        .mark-time.blue { color: #1565c0; }
        .mark-time.red { color: #d32f2f; }

        .summary-card { flex: 1; display: flex; flex-direction: column; }
        .summary-card h3 { margin-bottom: 18px; }

        .summary-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 14px;
        }

        .summary-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #ECECEC;
            border-radius: 14px;
            padding: 20px;
            transition: background 0.15s;
        }

        .summary-box:hover { background: #F8FAFF; }

        .summary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-icon {
            font-size: 40px;
            color: #5F6368;
            opacity: .9;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            color: #0F4AA1;
        }

        .summary-label {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .asis-loc-row {
            border: 1px solid #ECECEC;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: auto;
        }

        .asis-loc-row:hover { background: #F8FAFF; }

        .summary-icon-location {
            font-size: 30px;
            color: #5F6368;
            flex-shrink: 0;
        }

        /* Calendario */
        .asis-cal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .asis-cal-nav h3 { color: var(--color-primary); }

        .asis-cal-layout {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 16px;
            align-items: stretch;
        }

        .asis-cal-layout.sin-resumen { grid-template-columns: 1fr; }

        .asis-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-dow {
            text-align: center;
            font-weight: 600;
            color: var(--color-primary);
            font-size: 12px;
            padding: 4px 0;
        }

        .cal-dia {
            min-height: 96px;
            padding: 6px;
            border-radius: 8px;
            cursor: default;
            background: #f8f9fc;
            border: 2px solid #e0e0e0;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .cal-dia-num {
            font-weight: 700;
            font-size: 13px;
            color: #333;
        }

        .cal-dia.clicable {
            cursor: pointer;
            transition: all .15s;
        }

        .cal-dia.clicable:hover {
            border-color: var(--color-primary);
            background: #eef2ff;
        }

        .cal-dia.hoy {
            border-color: var(--color-primary);
            background: #e8eaf6;
        }

        .cal-dia.hoy .cal-dia-num { color: var(--color-primary); }

        .cal-dia.domingo { opacity: .4; }

        .cal-dia.tiene-registro {
            border-color: var(--color-success);
            background: #eaf7ea;
        }

        .cal-dia.es-falta {
            border-color: var(--color-danger);
            background: #fdecec;
        }

        .cal-dia-reg {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            background: rgba(0, 64, 161, 0.08);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 10px;
            color: var(--color-primary);
            font-weight: 600;
        }

        .cal-badge {
            align-self: stretch;
            margin-top: 2px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            border-radius: 6px;
            padding: 3px 4px;
            color: #fff;
        }

        .cal-badge-asistio { background: var(--color-success); }
        .cal-badge-tardanza { background: var(--color-accent); }
        .cal-badge-falta { background: var(--color-danger); }

        /* Resumen mensual */
        .resumen-mensual-panel {
            height: 100%;
            box-sizing: border-box;
            background: #f8f9fc;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .resumen-mensual-panel h4 {
            color: var(--color-primary);
            font-size: 16px;
            margin-bottom: 2px;
        }

        .rm-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #eee;
            flex: 1;
        }

        .rm-icon {
            font-size: 26px;
            color: var(--color-primary);
            flex-shrink: 0;
        }

        .rm-num {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            line-height: 1.1;
        }

        .rm-lbl {
            font-size: 13px;
            color: #888;
            line-height: 1.2;
        }

        /* Tabs */
        .asis-tab-panel { display: none; }
        .asis-tab-panel.active { display: block; }

        @media (max-width: 1100px) {
            .asis-dashboard { grid-template-columns: 1fr; }
            .mark-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 700px) {
            .mark-grid { grid-template-columns: 1fr; }
            .asis-time { font-size: 52px; }
            .asis-cal-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="main-area">

            <div class="toast" id="toast"></div>

            <!-- Modal de confirmación -->
            <div class="modal-overlay" id="confirmModal">
                <div class="modal-box">
                    <div class="modal-icon" id="modalIcon"></div>
                    <div class="modal-title" id="modalTitle">Confirmar</div>
                    <div class="modal-sub" id="modalSub">¿Estás seguro?</div>
                    <div class="modal-buttons">
                        <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Cancelar</button>
                        <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Sí, marcar</button>
                    </div>
                </div>
            </div>

            <div class="container" style="width:95%;max-width:1800px;margin:0 auto;padding:24px 0;">
                <div id="asisApp">
                    <!-- Contenido generado por JS -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="core/utils.js"></script>
    <script type="module" src="core/constants.js"></script>
    <script type="module" src="core/components.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/asistencia.js"></script>
</body>
</html>
